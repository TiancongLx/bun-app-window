# Bun 自身的配置。此处只承载 `bun fmt` 的格式化风格，
# 其余段（install / test / run）保持缺省，不在本文件里声明。
#
# 为什么把这些值写死而不是依赖默认值：`bun fmt --help` 把 `--tab-width`
# 标为 default: 2，而 1.4.4 的实际缺省输出是 4 空格。文档与实现不一致时，
# 依赖缺省值就等于依赖一个会变的事实。显式声明之后，风格由本文件决定。

[fmt]
# 本仓约定：空格缩进，不用 tab。
useTabs = false
tabWidth = 4
# 120 而非缺省的 80：本仓大量注释与断言自带上下文，
# 80 列会把它们拆成每行一个片段，反而降低可读性。
printWidth = 120
