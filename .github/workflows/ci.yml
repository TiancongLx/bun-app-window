# CI 门禁：类型检查 + 行为测试
#
# 这里刻意只跑 bun check 与 bun test，取舍如下：
#   - 不跑 `bun run build:native`：编译原生层需要 clang（llvm-mingw）与 vendor/webview2 头文件，
#     runner 上都没有。dist/libshell.dll 已纳入版本控制，测试直接消费这份预编译产物
#     （native-surface.test.ts 的 dlopen 断言依赖它，而该 DLL 的导入表只含系统 DLL 与 UCRT，
#     不依赖 WebView2Loader 或任何 mingw 运行时）。
#   - 不跑 `bun run build:exe`：单文件打包属于发版动作，不是每次提交都要验证的契约。
#   - 不跑 `bun run demo`：自检程序需要交互式桌面会话，runner 上不存在。
#
# Bun 版本锁定在 engines.bun 的下限，不追 latest，避免上游漂移把门禁搞红。

name: CI

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    gate:
        name: Gate (windows-latest)
        runs-on: windows-latest
        timeout-minutes: 10

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.4.3"

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Type check
              run: bun check

            - name: Test
              run: bun test
